name: Page Deployment Notification

on:
  page_build: # 깃허브 페이지 빌드가 발생했을 때 트리거

jobs:
  notify-success:
    runs-on: ubuntu-latest
    if: |
      github.event.build.status == 'built'
    steps:
      - name: 🟢 Notify Discord on Success
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "🌐 [${{ github.repository }}] github.io 배포 성공!"}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

  notify-failure:
    runs-on: ubuntu-latest
    if: |
      github.event.build.status != 'built'
    steps:
      - name: 🔴 Notify Discord on Failure
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "🚨 [${{ github.repository }}] github.io 배포 실패!"}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
