name: Discord Notification

on:
  deployment_status:

jobs:
  notify-discord:
    if: |
      github.event.deployment.environment == 'github-pages' &&
      (github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Get Current Time
        run: echo "CURRENT_TIME=$(TZ=Asia/Seoul date +'%m.%d %H:%M')" >> $GITHUB_ENV

      - name: Notify Discord
        run: |
          if [ "${{ github.event.deployment_status.state }}" = "success" ]; then
            COLOR=5763719
            EMOJI="🌐"
          else
            COLOR=15548997
            EMOJI="🚨"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "HTML 배포 결과",
                   "description": "'"$EMOJI"' [${{ github.repository }}] index.html 배포 **${{ github.event.deployment_status.state }}** (${{ env.CURRENT_TIME }})",
                   "color": '"$COLOR"'
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
