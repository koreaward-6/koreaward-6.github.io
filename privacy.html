<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개인정보 보호 정책</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 40px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #444;
    }
    .content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="content">
  <h1>개인정보 처리방침</h1>
  <p>본 봇은 사용자의 개인정보를 수집, 저장, 공유하지 않습니다. 알림 기능 제공을 위해 어떠한 개인 데이터도 요구하지 않으며, 디스코드 플랫폼 내에서 제공되는 기본 기능만 활용합니다.</p>

  <h2>수집하는 정보</h2>
  <p>디스코드 ID 외의 개인정보는 수집하지 않습니다.</p>

  <h2>정보 이용 목적</h2>
  <p>알림 기능 제공을 위한 최소한의 사용자 식별에만 사용됩니다.</p>

  <h2>보관 및 삭제</h2>
  <p>사용자가 봇을 제거하거나 서비스 이용을 중단하면 관련 정보는 즉시 삭제됩니다. 별도의 탈퇴 절차나 데이터 삭제 요청은 필요하지 않습니다.</p>
  </div>
</body>
</html>
