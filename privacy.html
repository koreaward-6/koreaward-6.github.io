<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>개인정보 보호 정책</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 40px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #444;
    }
    .content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>개인정보 보호 정책</h1>
    <p>
      본 봇은 사용자의 개인정보를 수집, 저장, 공유하지 않습니다.  
      알림 기능 제공을 위해 어떠한 개인 데이터도 요구하지 않으며,  
      디스코드 플랫폼 내에서 제공되는 기본 기능만 활용합니다.
    </p>
    <p>
      사용자는 언제든지 봇 사용을 중단할 수 있으며,  
      별도의 탈퇴 절차나 데이터 삭제 요청은 필요하지 않습니다.
    </p>
    <p>
      본 정책은 봇의 기능이 변경되지 않는 한 지속적으로 적용됩니다.
    </p>
  </div>
</body>
</html>
